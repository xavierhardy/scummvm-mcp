[scummvm]
lastselectedgame=toon-demo
browser_lastpath=%(game_path)s
mute=false
# Not 11: from level 2 the engine traces every walkable-pixel test its
# pathfinder makes (~1M lines a walk, ~3 GB a run), which drags the game down
# to a frame a second under parallel load and times the client out mid-walk.
# Level 1 still carries the bridge's own stream log.
debuglevel=1
logfile=%(logfile)s
screenshotpath=%(screenshot_path)s
extrapath=%(extra_path)s

[toon-demo]
description=Toonstruck (Demo/DOS/English)
path=%(game_path)s
extrapath=%(extra_path)s
mcp_port=%(mcp_port)s
mcp=true
mcp_skip_tool=true
mcp_debug=true
mute=true
sfx_volume=0
music_volume=0
speech_volume=0
speech_mute=true
subtitles=true
engineid=toon
gameid=toon
extra=Demo
language=en
platform=pc
tts_enabled=false
