# debuglevel is 1 here, not the 11 the other games use: this engine's
# detection table is enormous - every Myst and Riven variant - and writing a
# line per candidate to a file takes minutes on a slow machine, which the
# connect timeout then spends waiting for a game that has not started yet.
[scummvm]
lastselectedgame=cstime-demo
browser_lastpath=%(game_path)s
mute=false
debuglevel=1
logfile=%(logfile)s
screenshotpath=%(screenshot_path)s

[cstime-demo]
description=Where in Time is Carmen Sandiego? (Demo/Windows/English)
path=%(game_path)s
mcp_port=%(mcp_port)s
mcp=true
mcp_skip_tool=true
mcp_debug=true
mute=true
sfx_volume=0
music_volume=0
speech_volume=0
speech_mute=true
subtitles=true
engineid=mohawk
gameid=cstime
tts_enabled=false
