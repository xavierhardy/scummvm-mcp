[scummvm]
lastselectedgame=kq7-full
browser_lastpath=%(game_path)s
mute=false
debuglevel=1
logfile=%(logfile)s
screenshotpath=%(screenshot_path)s

[kq7-full]
description=King's Quest VII: The Princeless Bride
path=%(game_path)s
mcp_port=%(mcp_port)s
mcp=true
mcp_skip_tool=true
mcp_debug=true
mute=true
talkspeed=255
sfx_volume=0
music_volume=0
speech_volume=0
speech_mute=true
# Subtitles off for this game alone: with them on the engine opens a modal
# warning (King's Quest 7's subtitling was left unfinished in the release
# version) and waits there before its first game cycle, which headless is a
# hang — the game never answers, and every test on it times out.
subtitles=false
engineid=sci
gameid=kq7
tts_enabled=false
copy_protection=false
