[pytest]
minversion = 8.0
# Serialization/collection config for running this tree standalone (from
# test/mcp). The consolidated project (scummvm_bench/pyproject.toml) carries the
# same settings for the combined run; this file only applies when pytest's
# rootdir is test/mcp, and is ignored when the suite is driven from scummvm_bench.
#
# --dist=loadgroup is what honours the xdist_group markers: the no-save FT/
# Atlantis demos are strictly-ordered single-instance walkthroughs and MUST all
# run on one worker (see conftest.py). Without it, -n scatters them across
# workers, each session-scoped fixture launches its own fresh demo, and the
# ordered tests fall out of sync (Ben stuck at the opening, room 10).
addopts = --dist=loadgroup --import-mode=importlib
markers =
    xdist_group: pin all tests sharing the group name to one xdist worker (no-save games like FT/Atlantis)
    slow: long-running test, skipped when SKIP_SLOW_TESTS is true/1
    real: launches a real ScummVM (slow; opt-in via --run-real)
