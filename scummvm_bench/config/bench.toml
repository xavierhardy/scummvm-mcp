# Default configuration for scummvm_bench.
# CLI flags override anything set here.

# Path to the built ScummVM binary (relative paths resolved from the repo root).
scummvm_binary = "../scummvm"

# Directory holding the vendored per-game scummvm.ini templates.
# (Defaults to scummvm_bench/config/ini_templates when unset.)
# ini_templates_dir = "config/ini_templates"

# Where save-state folders live (one subfolder per game id), unless --save-folder
# is passed. The launcher looks for <save_folder>/<game_id>/<game_id>.sNN.
# save_folder = "../test/mcp/save_slots"

# The games the bench can run: ScummVM target id + default save slot. Their
# data folders are per-machine and are NOT configured here — they come from
# the non-committed game_paths.local.toml at the repository root (see
# game_paths.local.toml.example). A game with no folder configured is skipped.
[[games]]
id = "monkey-ega-demo"
save_slot = 1

[[games]]
id = "maniac-c64"
save_slot = 1

[[games]]
id = "comi-demo"
save_slot = 1

[[games]]
id = "samnmax"
save_slot = 1

[[games]]
id = "dig-demo"
save_slot = 1

# Passport to Adventure carries both the Loom (save slot 2) and Indy3 (save slot
# 3) demo segments; pass the slot with --game pass:2 / pass:3.
[[games]]
id = "pass"
save_slot = 2

# Fate of Atlantis demo has no save support; it runs from its intro. Its boot
# script overrides the configured talkspeed, so the bench forces the max text
# speed at runtime via the mcp_debug-gated set_talk_speed tool (see RealBackend).
[[games]]
id = "atlantis"

# Local LM Studio models, only used with --local. The `key` is the lms download
# key; params mirror `lms load` flags. `provider`/`model` are how the model is
# registered in pi's models.json and selected by the harness.
[[local_models]]
key = "google/gemma-3-4b"
provider = "local"
model = "gemma-3-4b"
context_length = 8192
gpu = "max"
ttl = 3600
base_url = "http://localhost:1234/v1"
