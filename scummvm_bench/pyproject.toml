[project]
name = "scummvm-bench"
version = "0.1.0"
description = "MCP proxy bench-harness for benchmarking LLMs and agent harnesses against the ScummVM MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
local = ["lmstudio>=1.0"]

[project.scripts]
scummvm-bench = "scummvm_bench.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

# Pin public PyPI: the machine's global pip/uv config points at a private index
# that 403s for these packages. Keep resolution deterministic for this project.
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scummvm_bench"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
# Type-check the library strictly; test code intentionally pokes at dynamic
# JSON result dicts (dict[str, object]) and is exercised by the test suite.
exclude = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=scummvm_bench --cov-report=term-missing --cov-fail-under=70"
